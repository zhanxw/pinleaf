<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Soft outer elevation shadow for the squircle tile -->
    <filter id="squircle-shadow" x="-16%" y="-16%" width="132%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.42" />
    </filter>

    <!-- Soft drop shadows for fanned page sheets -->
    <filter id="sheet2-shadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="-6" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.28" />
    </filter>
    <filter id="sheet3-shadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="-8" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.36" />
    </filter>

    <!-- Crisp 3D elevation shadow for the sculpted leaf-pin -->
    <filter id="pin-shadow" x="-45%" y="-25%" width="190%" height="165%">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#042f2e" flood-opacity="0.42" />
    </filter>

    <!-- Apple HIG C1 superellipse squircle path -->
    <path
      id="squircle-shape"
      d="M 512 100 C 716 100, 808 100, 866 158 C 924 216, 924 308, 924 512 C 924 716, 924 808, 866 866 C 808 924, 716 924, 512 924 C 308 924, 216 924, 158 866 C 100 808, 100 716, 100 512 C 100 308, 100 216, 158 158 C 216 100, 308 100, 512 100 Z"
    />

    <clipPath id="squircle-clip">
      <use href="#squircle-shape" />
    </clipPath>

    <!-- Deep midnight-to-sapphire background gradient -->
    <linearGradient id="bg-grad" x1="120" y1="100" x2="904" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091124" />
      <stop offset="52%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle emerald-cyan ambient radial glow under the leaf-pin -->
    <radialGradient id="ambient-glow" cx="680" cy="290" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#091124" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle top-edge inner glass rim gradient -->
    <linearGradient id="rim-grad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.28" />
    </linearGradient>

    <!-- Leaf #2 cool ice-ivory sheet gradient -->
    <linearGradient id="sheet2-grad" x1="262" y1="232" x2="698" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Leaf #3 warm-white paper gradient -->
    <linearGradient id="sheet3-grad" x1="296" y1="218" x2="752" y2="798" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Golden-amber highlight band gradient -->
    <linearGradient id="highlight-grad" x1="342" y1="366" x2="694" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Emerald botanical leaf two-tone gradients -->
    <linearGradient id="leaf-left-grad" x1="-88" y1="-260" x2="0" y2="-70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leaf-right-grad" x1="0" y1="-270" x2="92" y2="-66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Metallic warm gold pin gradients -->
    <linearGradient id="gold-grad" x1="-22" y1="-250" x2="22" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gold-needle-grad" x1="-8" y1="-58" x2="8" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Background Tile -->
  <g filter="url(#squircle-shadow)">
    <use href="#squircle-shape" fill="url(#bg-grad)" />
  </g>
  <g clip-path="url(#squircle-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ambient-glow)" />
    <!-- Subtle geometric grid glow lines echoing multi-view split geometry -->
    <path d="M 100 660 L 924 540" stroke="#60a5fa" stroke-opacity="0.06" stroke-width="2" />
    <path d="M 100 320 L 924 230" stroke="#60a5fa" stroke-opacity="0.06" stroke-width="2" />
  </g>
  <!-- Inner glass rim stroke -->
  <path
    d="M 512 102.5 C 714.5 102.5, 806 102.5, 864.2 159.8 C 921.5 217, 921.5 309.5, 921.5 512 C 921.5 714.5, 921.5 806, 864.2 864.2 C 806 921.5, 714.5 921.5, 512 921.5 C 309.5 921.5, 217 921.5, 159.8 864.2 C 102.5 806, 102.5 714.5, 102.5 512 C 102.5 309.5, 102.5 217, 159.8 159.8 C 217 102.5, 309.5 102.5, 512 102.5 Z"
    fill="none"
    stroke="url(#rim-grad)"
    stroke-width="4"
  />

  <!-- 2. Multi-View Fanned Reading Leaves (#1 -> #2 -> #3) -->
  <!-- Leaf #1: Back Frozen Ancestor -->
  <g transform="translate(330, 770) rotate(-13) translate(-330, -770)">
    <rect
      x="235"
      y="245"
      width="420"
      height="530"
      rx="34"
      fill="#60a5fa"
      fill-opacity="0.28"
      stroke="#93c5fd"
      stroke-opacity="0.45"
      stroke-width="2.5"
    />
    <!-- Ancestor lock indicator pip -->
    <rect x="235" y="314" width="12" height="50" rx="6" fill="#fbbf24" fill-opacity="0.72" />
  </g>

  <!-- Leaf #2: Middle Frozen Branch -->
  <g transform="translate(355, 775) rotate(-6.5) translate(-355, -775)" filter="url(#sheet2-shadow)">
    <rect
      x="262"
      y="232"
      width="436"
      height="548"
      rx="36"
      fill="url(#sheet2-grad)"
      fill-opacity="0.64"
      stroke="#e0f2fe"
      stroke-opacity="0.55"
      stroke-width="2.5"
    />
    <!-- Amber frozen-lock tab -->
    <rect x="262" y="300" width="14" height="58" rx="7" fill="#f59e0b" />
    <!-- Subtle background header & lines on branched sheet -->
    <rect x="304" y="276" width="140" height="14" rx="7" fill="#1e3a8a" fill-opacity="0.25" />
    <rect x="304" y="310" width="220" height="10" rx="5" fill="#1e3a8a" fill-opacity="0.16" />
  </g>

  <!-- Leaf #3: Foreground Active PDF Page -->
  <g filter="url(#sheet3-shadow)">
    <rect
      x="296"
      y="218"
      width="456"
      height="580"
      rx="38"
      fill="url(#sheet3-grad)"
      stroke="#ffffff"
      stroke-width="2"
    />

    <!-- Page Top Header & Badge -->
    <rect x="342" y="266" width="206" height="22" rx="11" fill="#1e293b" />
    <rect x="342" y="308" width="320" height="14" rx="7" fill="#cbd5e1" />
    <rect x="342" y="334" width="256" height="14" rx="7" fill="#cbd5e1" />

    <!-- Luminous Golden-Amber Selected / Highlighted Passage -->
    <rect x="342" y="366" width="352" height="64" rx="16" fill="url(#highlight-grad)" />
    <rect x="342" y="366" width="14" height="64" rx="7" fill="#d97706" />
    <rect x="372" y="382" width="286" height="12" rx="6" fill="#78350f" fill-opacity="0.82" />
    <rect x="372" y="404" width="214" height="12" rx="6" fill="#78350f" fill-opacity="0.72" />

    <!-- Clean Body Text Lines -->
    <rect x="342" y="454" width="352" height="14" rx="7" fill="#94a3b8" fill-opacity="0.55" />
    <rect x="342" y="482" width="318" height="14" rx="7" fill="#94a3b8" fill-opacity="0.55" />
    <rect x="342" y="510" width="276" height="14" rx="7" fill="#94a3b8" fill-opacity="0.45" />

    <!-- Two-Column Scholarly Footer: Figure Diagram Card + Paragraph Column -->
    <rect x="342" y="556" width="166" height="184" rx="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Mini figure plot inside left column -->
    <path
      d="M 366 686 L 398 648 L 434 662 L 478 602"
      fill="none"
      stroke="#2563eb"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="478" cy="602" r="9" fill="#10b981" />
    <rect x="364" y="708" width="96" height="10" rx="5" fill="#94a3b8" />

    <!-- Right scholarly column lines -->
    <rect x="530" y="562" width="164" height="14" rx="7" fill="#cbd5e1" />
    <rect x="530" y="592" width="152" height="14" rx="7" fill="#cbd5e1" />
    <rect x="530" y="622" width="164" height="14" rx="7" fill="#cbd5e1" />
    <rect x="530" y="652" width="132" height="14" rx="7" fill="#cbd5e1" />
    <rect x="530" y="682" width="164" height="14" rx="7" fill="#cbd5e1" />
    <rect x="530" y="712" width="112" height="14" rx="7" fill="#cbd5e1" />
  </g>

  <!-- Pin-pierce shadow dimple right on the highlight band -->
  <ellipse cx="644" cy="400" rx="22" ry="9" fill="#78350f" fill-opacity="0.34" />
  <circle cx="644" cy="399" r="5" fill="#451a03" fill-opacity="0.7" />

  <!-- 3. Sculpted Emerald & Gold "Pin-Leaf" Focal Mark -->
  <g transform="translate(644, 398) rotate(34)" filter="url(#pin-shadow)">
    <!-- Tapered Metallic Gold Pin Needle -->
    <path d="M 0,0 L -8,-58 L 8,-58 Z" fill="url(#gold-needle-grad)" />
    <!-- Specular needle highlight -->
    <path d="M 0,0 L -3,-58 L 1,-58 Z" fill="#fef3c7" fill-opacity="0.65" />

    <!-- Gold Bolster Collar -->
    <rect
      x="-20"
      y="-72"
      width="40"
      height="16"
      rx="8"
      fill="url(#gold-grad)"
      stroke="#fde68a"
      stroke-width="1.5"
    />

    <!-- Two-Tone 3D Emerald Botanical Leaf Blade (y = -66..-284) -->
    <!-- Sunlit Left Half -->
    <path
      d="M 0,-66 C -54,-78 -86,-128 -78,-184 C -71,-232 -32,-266 0,-284 Z"
      fill="url(#leaf-left-grad)"
    />
    <!-- Rich Deep Right Half -->
    <path
      d="M 0,-66 C 54,-78 86,-128 78,-184 C 71,-232 32,-266 0,-284 Z"
      fill="url(#leaf-right-grad)"
    />
    <!-- Crisp Outer Botanical Rim Highlight -->
    <path
      d="M 0,-66 C -54,-78 -86,-128 -78,-184 C -71,-232 -32,-266 0,-284 C 32,-266 71,-232 78,-184 C 86,-128 54,-78 0,-66 Z"
      fill="none"
      stroke="#a7f3d0"
      stroke-opacity="0.75"
      stroke-width="3"
    />

    <!-- Delicate Lateral Leaf Veins -->
    <path
      d="M 0,-116 Q -26,-126 -48,-148 M 0,-116 Q 26,-126 48,-148 M 0,-166 Q -28,-178 -48,-202 M 0,-166 Q 28,-178 48,-202 M 0,-210 Q -18,-220 -32,-238 M 0,-210 Q 18,-220 32,-238"
      fill="none"
      stroke="#a7f3d0"
      stroke-opacity="0.45"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Golden Midrib Vein -->
    <path
      d="M 0,-66 L 0,-242"
      fill="none"
      stroke="url(#gold-grad)"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Golden Circular Pinhead / Lock Eyelet Ring -->
    <circle cx="0" cy="-138" r="18" fill="url(#gold-grad)" stroke="#fef3c7" stroke-width="2" />
    <circle cx="0" cy="-138" r="7" fill="#0f172a" />
  </g>
</svg>
